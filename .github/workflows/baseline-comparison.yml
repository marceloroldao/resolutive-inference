name: Baseline comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "src/resolutive_inference/baselines.py"
      - "benchmarks/baselines/**"
      - "tests/test_baselines.py"
      - ".github/workflows/baseline-comparison.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run baseline comparison
        run: python -m benchmarks.baselines.robust119 --length 1000 --seeds 20

name: Server benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/server/**"
      - "tests/test_server_benchmark.py"
      - ".github/workflows/server-benchmark.yml"
  workflow_dispatch:

jobs:
  latency:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run server latency benchmark
        run: python -m benchmarks.server.latency --iterations 200 --length 24

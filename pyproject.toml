[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutive-inference"
version = "0.1.0"
description = "Experimental compact sequential inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-RRNCL-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Marcelo Roldão Matos" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutive-inference"
version = "0.2.0rc1"
description = "Experimental compact sequential inference engine with PC/server API"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-RRNCL-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Marcelo Roldão Matos" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
server = ["fastapi>=0.116", "uvicorn[standard]>=0.35"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.28", "fastapi>=0.116"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
